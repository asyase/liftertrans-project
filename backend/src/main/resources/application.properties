spring.application.name=backend

# PostgreSQL
# P6Spy - settings
spring.datasource.url=jdbc:p6spy:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:vali_it}
spring.datasource.driverClassName=com.p6spy.engine.spy.P6SpyDriver

# normal settings
#spring.datasource.driverClassName=org.postgresql.Driver
#spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:vali_it}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:student123}

# JPA stuff
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Enable SQL initialization
spring.sql.init.mode=always

# Disable Hibernate DDL generation to avoid conflicts
spring.jpa.hibernate.ddl-auto=none

# Google AI (NL-to-SQL chat) - API võti tuleb keskkonnamuutujast GOOGLE_GENAI_API_KEY
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GOOGLE_GENAI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.1-flash-lite
spring.ai.google.genai.chat.options.response-mime-type=application/json
spring.ai.google.genai.chat.options.max-output-tokens=1024
